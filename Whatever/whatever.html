            <script>
                (function () {
                    const intro = document.getElementById("intro");
                    if (!intro) return;

                    intro.classList.remove("hidden");
                    intro.classList.remove("fade-out");
                    intro.setAttribute("aria-hidden", "false");

                    setTimeout(() => {
                        intro.classList.add("fade-out");
                        setTimeout(() => {
                            intro.classList.add("hidden");
                            intro.setAttribute("aria-hidden", "true");
                        }, 500);
                    }, 1000);
                })();

                /* Fluidity of the hamburger menu (desktop and mobile) */
                document.getElementById("mobile-nav-toggle").onclick = function() {
                    this.classList.toggle("open");
                    document.querySelector("#nav_menu ul").classList.toggle("open");
                }

                const navToggle = document.getElementById("mobile-nav-toggle");
                const navMenu = document.querySelector("#nav_menu ul");
                const navLinks = document.querySelectorAll("#nav_menu ul li a");

                navLinks.forEach(link => {
                    link.addEventListener("click", () => {
                        /*Not removing - gif shows when going to a different page*/
                        /*navMenu.classList.remove("open");
                        navToggle.classList.remove("open");*/
                    })
                })

                document.addEventListener("click", function(event) {
                    const isMenuOpen = navMenu.classList.contains("open");
                    if (
                        isMenuOpen && !navMenu.contains(event.target) && 
                        event.target !== navToggle && !navToggle.contains(event.target)
                    ) { 
                        navMenu.classList.remove("open");
                        navToggle.classList.remove("open");
                    }
                })


            </script>
